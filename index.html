```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>

    <style>
        body {
            margin: 0;
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 25px;
        }

        #score {
            font-size: 22px;
            margin: 10px;
        }

        canvas {
            background: #111;
            border: 3px solid #fff;
            display: block;
            margin: 20px auto;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background: #ccc;
        }

        .controls {
            margin-top: 10px;
        }

        .controls button {
            margin: 3px;
            width: 55px;
        }
    </style>
</head>

<body>

    <h1>🐍 Snake Game</h1>

    <div id="score">Score: 0</div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <button onclick="restartGame()">Restart Game</button>

    <div class="controls">
        <div>
            <button onclick="changeDirection('UP')">⬆️</button>
        </div>
        <div>
            <button onclick="changeDirection('LEFT')">⬅️</button>
            <button onclick="changeDirection('DOWN')">⬇️</button>
            <button onclick="changeDirection('RIGHT')">➡️</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const box = 20;

        let snake;
        let food;
        let direction;
        let score;
        let game;

        function startGame() {
            snake = [
                { x: 200, y: 200 },
                { x: 180, y: 200 },
                { x: 160, y: 200 }
            ];

            direction = "RIGHT";
            score = 0;

            document.getElementById("score").innerText =
                "Score: " + score;

            createFood();

            clearInterval(game);
            game = setInterval(drawGame, 100);
        }

        function createFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / box)) * box,
                y: Math.floor(Math.random() * (canvas.height / box)) * box
            };
        }

        function drawGame() {

            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw food
            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, box, box);

            // Draw snake
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "lime" : "green";
                ctx.fillRect(part.x, part.y, box, box);
            });

            let head = {
                x: snake[0].x,
                y: snake[0].y
            };

            // Move snake
            if (direction === "UP") {
                head.y -= box;
            }

            if (direction === "DOWN") {
                head.y += box;
            }

            if (direction === "LEFT") {
                head.x -= box;
            }

            if (direction === "RIGHT") {
                head.x += box;
            }

            // Check wall collision
            if (
                head.x < 0 ||
                head.x >= canvas.width ||
                head.y < 0 ||
                head.y >= canvas.height
            ) {
                gameOver();
                return;
            }

            // Check snake collision
            for (let i = 0; i < snake.length; i++) {
                if (
                    head.x === snake[i].x &&
                    head.y === snake[i].y
                ) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Check food
            if (head.x === food.x && head.y === food.y) {
                score++;

                document.getElementById("score").innerText =
                    "Score: " + score;

                createFood();
            } else {
                snake.pop();
            }
        }

        function changeDirection(newDirection) {

            if (
                newDirection === "UP" &&
                direction !== "DOWN"
            ) {
                direction = "UP";
            }

            if (
                newDirection === "DOWN" &&
                direction !== "UP"
            ) {
                direction = "DOWN";
            }

            if (
                newDirection === "LEFT" &&
                direction !== "RIGHT"
            ) {
                direction = "LEFT";
            }

            if (
                newDirection === "RIGHT" &&
                direction !== "LEFT"
            ) {
                direction = "RIGHT";
            }
        }

        function gameOver() {
            clearInterval(game);

            alert("Game Over! Your score is " + score);
        }

        function restartGame() {
            startGame();
        }

        // Keyboard controls
        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowUp") {
                changeDirection("UP");
            }

            if (event.key === "ArrowDown") {
                changeDirection("DOWN");
            }

            if (event.key === "ArrowLeft") {
                changeDirection("LEFT");
            }

            if (event.key === "ArrowRight") {
                changeDirection("RIGHT");
            }
        });

        startGame();
    </script>

</body>
</html>
